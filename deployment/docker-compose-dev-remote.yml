services:
  nginx:
    container_name: nginx
    image: nginx:latest
    restart: unless-stopped
    #image: fabiocicerchia/nginx-lua:latest
    ports:
      - 80:80
    volumes:
      - $ORBS_ROOT/deployment/nginx/conf.d:/etc/nginx/conf.d
      - /opt/orbs:/opt/orbs
    depends_on:
      - logger
    healthcheck:
      test: service nginx status || exit 1

  ethereum-reader:
    networks:
      default:
        aliases:
          - management-service
    container_name: ethereum-reader
    image: orbsnetworkstaging/management-service:1736783819
    restart: unless-stopped
    command: "npm start"
    volumes:
      - /opt/orbs/ethereum-reader:/opt/orbs/status
      - ${DOCKER_COMPOSE_FILE}:/opt/orbs/deployment.yml
    environment:
      - DOCKER_COMPOSE_DESCRIPTOR_URL
      #- INJECT_FAKE_GUARDIAN={"name":"jordalishNode","ip":"0x7F000001"}
      - NODE_ADDRESS
      - ETHEREUM_ENDPOINT
      - CHAIN=ethereum
      - MODE=dev
    healthcheck:
      test: node healthcheck.js || exit 1

  ethereum-writer:
    container_name: ethereum-writer
    image: lukerogerson1/ethereum-writer:v1.7.3-main
    restart: unless-stopped
    command: "npm start"
    volumes:
      - /opt/orbs/ethereum-writer:/opt/orbs/status
    environment:
      - ETHEREUM_ELECTIONS_CONTRACT=0x02Ca9F2c5dD0635516241efD480091870277865b
      - ETHEREUM_ENDPOINT
      - NODE_PRIVATE_KEY
      - SIGNER_ENDPOINT
      - NODE_ADDRESS
      - MANAGEMENT_SERVICE_ENDPOINT=http://nginx/service/ethereum-reader
    healthcheck:
      test: node healthcheck.js || exit 1

  matic-reader:
    container_name: matic-reader
    image: orbsnetworkstaging/management-service:1736783819
    restart: unless-stopped
    command: "npm start"
    volumes:
      - /opt/orbs/matic-reader:/opt/orbs/status
      - ${DOCKER_COMPOSE_FILE}:/opt/orbs/deployment.yml
    environment:
      - NODE_ADDRESS
      - ETHEREUM_GENESIS_CONTRACT=0x35eA0D75b2a3aB06393749B4651DfAD1Ffd49A77
      - ETHEREUM_ENDPOINT=${MATIC_ENDPOINT}
      - ETHEREUM_FIRST_BLOCK=21700000
      - ETHEREUM_POLL_INTERVAL_SECONDS=300
      - CHAIN=polygon
      - MODE=dev
    healthcheck:
      test: node healthcheck.js || exit 1

  matic-writer:
    container_name: matic-writer
    image: lukerogerson1/ethereum-writer:v1.7.3-main
    restart: unless-stopped
    command: "npm start"
    volumes:
      - /opt/orbs/matic-writer:/opt/orbs/status
    environment:
      - ETHEREUM_ELECTIONS_CONTRACT=0x94f2da1ef22649c642500e8B1C3252A4670eE95b
      - ETHEREUM_ENDPOINT=${MATIC_ENDPOINT}
      - NODE_PRIVATE_KEY
      - SIGNER_ENDPOINT
      - NODE_ADDRESS
      - MANAGEMENT_SERVICE_ENDPOINT=http://nginx/service/matic-reader
      - ETHEREUM_DISCOUNT_GAS_PRICE_FACTOR=1
    healthcheck:
      test: node healthcheck.js || exit 1

  signer:
    container_name: signer
      #image: orbsnetworkstaging/signer:v2.6.1-immediate
    image: orbsnetworkstaging/signer:v2.6.0-59e1b92f
    restart: unless-stopped
    #command: "/opt/orbs/orbs-signer"
    volumes:
      - /opt/orbs/signer:/opt/orbs/status
    environment:
      - MULTILOG_DISABLED=1
      - NODE_PRIVATE_KEY
      - NODE_ADDRESS
      - HTTP_ADDRESS=:80
    healthcheck:
      test: "/opt/orbs/healthcheck --url http://localhost:80 --output /opt/orbs/status/status.json"

  logger:
    container_name: logger
    image: orbsnetworkstaging/v4-logger:v0.0.1
    restart: unless-stopped
    volumes:
      - $PODMAN_SOCKET_PATH:/var/run/docker.sock
      - /opt/orbs/logger:/opt/orbs/status
    environment:
      - STATUS_FILE_PATH=/opt/orbs/status/status.json
    healthcheck:
      # TODO: improve this healthcheck
      test: ping -c 1 logger || exit 1


  vm-notifications:
    restart: unless-stopped
    container_name: vm-notifications
      #image: orbsnetwork/vm-notifications:v1.0.2
    image: orbsnetwork/vm-notifications:v1.0.31
    entrypoint: ["/opt/orbs/service"]
    #command: ["--config","/run/secrets/config.json","--config","/run/secrets/keys.json"]  
    volumes:
      - $PODMAN_SOCKET_PATH:/var/run/docker.sock
      - /opt/orbs/vm-notifications:/opt/orbs/status
    environment:
      - MULTILOG_DISABLED=1
      - STATUS_FILE_PATH=/opt/orbs/status/status.json
    healthcheck:
      # TODO: improve this healthcheck
      test: ping -c 1 logger || exit 1

  vm-lambda:
    restart: unless-stopped
    container_name: vm-lambda
    image: orbsnetwork/vm-lambda:v0.0.27
    entrypoint: ["/opt/orbs/service"]
    #command: ["--config","/run/secrets/config.json","--config","/run/secrets/keys.json"]
    volumes:
      - $PODMAN_SOCKET_PATH:/var/run/docker.sock
      - /opt/orbs/vm-lambda:/opt/orbs/status
    environment:
      - MULTILOG_DISABLED=1
      - STATUS_FILE_PATH=/opt/orbs/status/status.json
        #    healthcheck:
      # TODO: improve this healthcheck
      #test: "/opt/orbs/healthcheck.sh --url http://localhost:80 --output /opt/orbs/status/status.json"
      # depends_on:
      #- ethereum-reader

  vm-twap:
    restart: unless-stopped
    container_name: vm-twap
    image: orbsnetwork/vm-twap:v1.19.31
    entrypoint: ["/opt/orbs/service"]
    #command: ["--config","/run/secrets/config.json","--config","/run/secrets/keys.json"]
    volumes:
      - $PODMAN_SOCKET_PATH:/var/run/docker.sock
      - /opt/orbs/vm-twap:/opt/orbs/status
    environment:
      - MULTILOG_DISABLED=1
      - STATUS_FILE_PATH=/opt/orbs/status/status.json
        #    healthcheck:
      # TODO: improve this healthcheck
      #test: "/opt/orbs/healthcheck.sh --url http://localhost:80 --output /opt/orbs/status/status.json"
    depends_on:
      - ethereum-reader


networks:
  default:
    name: custom_network
    external: true
