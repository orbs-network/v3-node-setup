server {
  listen 80;
  server_name _;

  # Use Docker default network DNS resolver (required for variable-based proxy_pass)
  resolver 172.20.0.1 ipv6=off valid=30s;

  # Match /service/vm-* and delegate to the corresponding vm-* service
  location ~* ^/service/(vm-[^/]+)(/.*)?$ {
    # Extract the service name (e.g., vm-lambda, vm-anything)
    set $service_name $1;

    # Rewrite to remove /service/<SERVICE_NAME> and keep the remaining path
    # If path exists: /service/vm-lambda/path -> /path
    # If no path: /service/vm-lambda -> /
    rewrite ^/service/(vm-[^/]+)(/.*)?$ $2 break;
    # Ensure we have at least / if path was empty
    rewrite ^$ / break;

    # Proxy to the vm-* service with the remaining path
    proxy_pass http://$service_name;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
