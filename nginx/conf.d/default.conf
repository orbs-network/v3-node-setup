server {
    listen 80;
    server_name _;

    # Use Docker default network DNS resolver (required for variable-based proxy_pass)
    resolver 127.0.0.11 ipv6=off valid=30s;

    # rewrite all plural service(s) and log(s) to a single form
    location ~* ^/services/(.*)$ {
        rewrite ^/services/(.*)$ /service/$1 last;
    }

    # rewrite all "boyar" with "manager"
    location ~* ^/service/boyar/(.*)$ {
        rewrite ^/service/boyar/(.*)$ /service/manager/$1 last;
    }
    # rewrite all "log-service" with "logger"
    location ~* ^/service/logs-service/(.*)$ {
        rewrite ^/service/logs-service/(.*)$ /service/logger/$1 last;
    }
    # rewrite all "management-service" as "ethereum-reader"
    location ~* ^/service/management-service/(.*)$ {
        rewrite ^/service/management-service/(.*)$ /service/ethereum-reader/$1 last;
    }

    # Match any service starting with "vm-" and extract its name and remaining path
    location ~* ^/service/(vm-[^/]+)(/.*)?$ {
        # Extract the service name
        set $service_name $1;

        # Rewrite the URI: remove /service/<SERVICE_NAME> and keep the remaining path
        # If path exists: /service/vm-lambda/path -> /path
        # If no path: /service/vm-lambda -> / (empty string becomes /)
        rewrite ^/service/(vm-[^/]+)(/.*)?$ $2 break;
        # Ensure we have at least / if path was empty
        rewrite ^$ / break;

        # Pass the request to the backend
        proxy_pass http://$service_name;

        # Preserve headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    # handle static log(s) from .data for non-container services (e.g. control)
    location ~* ^/service/(manager|updater|recovery|control)/logs?$ {
        default_type text/plain;
        alias /opt/orbs/.data/$1/log.txt;
    }

    # Expose container status pages (from .data/<service>/)
    location ~* ^/service/([a-zA-Z0-9_-]+)/status$ {
        default_type application/json;
        alias /opt/orbs/.data/$1/status.json;
    }

    # manager log is a special case as it is not a service

    # Expose container logs (rewrite request to always be in /log in single )
    location ~ ^/service/([a-zA-Z0-9_.-]+)/logs?$ {
        rewrite ^/service/([a-zA-Z0-9_.-]+)/logs? /service/$1/log break;
        proxy_pass http://logger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
